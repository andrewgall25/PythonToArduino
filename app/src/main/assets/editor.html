<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monaco Editor Trasparente</title>

    <style>
        html, body {
          margin: 0; padding: 0;
          height: 100%; width: 100%;
          display: flex; flex-direction: column;
          background: transparent !important;
          box-sizing: border-box;
          position: relative;
          overflow: hidden;
        }
        #container {
          height: 100%; width: 100%;
          overflow: hidden;
          background-color: transparent !important;
          position: relative;
          flex-grow: 1;
        }

        @font-face {
          font-family: 'JetBrainsMono';
          src: url('JetBrainsMonoNL-Regular.ttf') format('truetype');
          font-weight: normal;
          font-style: normal;
          font-display: swap;
        }

        .monaco-editor {
          font-family: 'JetBrainsMono', 'Consolas', 'Courier New', monospace !important;
          /* FIX ANDROID: Forza kerning e rendering ottimale */
          font-kerning: none !important;
          text-rendering: geometricPrecision !important;
          letter-spacing: 0px !important;
          font-variant-ligatures: none !important;
          font-feature-settings: "kern" 0 !important;
          -webkit-font-feature-settings: "kern" 0 !important;
          -webkit-text-stroke: 0.01px transparent !important;
        }

        .monaco-editor,
        .monaco-editor-background,
        .monaco-editor .margin,
        .monaco-editor .monaco-editor-background,
        .monaco-editor .inputarea.ime-input,
        .monaco-scrollable-element {
          background: transparent !important;
        }

        /* FIX ANDROID: Forza stili per input area */
        .monaco-editor .inputarea {
          font-family: 'JetBrainsMono', 'Consolas', 'Courier New', monospace !important;
          font-kerning: none !important;
          letter-spacing: 0px !important;
          text-rendering: geometricPrecision !important;
        }

        /* FIX ANDROID: Stili per le linee di codice */
        .monaco-editor .view-lines {
          font-variant-ligatures: none !important;
          font-kerning: none !important;
        }

        body:focus,
        html:focus,
        #container:focus {
          outline: none !important;
          -webkit-tap-highlight-color: transparent;
          box-shadow: none !important;
        }

        * {
          outline: none !important;
        }

        .monaco-editor.focused .monaco-editor-overlay-widget,
        .monaco-editor * {
          outline: none !important;
          box-shadow: none !important;
        }

        .monaco-editor *::before,
        .monaco-editor *::after {
          outline: none !important;
          box-shadow: none !important;
        }

        .monaco-editor .line-numbers {
          /* Nessun font custom qui */
        }
    </style>

    <script src="monaco-editor/min/vs/loader.js"></script>
</head>
<body>
<div id="container"></div>

<script>
    function debounce(func, delay) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), delay);
      };
    }

    self.MonacoEnvironment = {
      getWorkerUrl: function (moduleId, label) {
        const base = './monaco-editor/min/vs/';
        switch (label) {
          case 'json': return base + 'language/json/jsonWorker.js';
          case 'css':
          case 'scss':
          case 'less': return base + 'language/css/cssWorker.js';
          case 'html':
          case 'handlebars':
          case 'razor': return base + 'language/html/htmlWorker.js';
          case 'typescript':
          case 'javascript': return base + 'language/typescript/tsWorker.js';
          default: return base + 'base/worker/workerMain.js?label=' + label;
        }
      }
    };

    require.config({ paths: { 'vs': 'monaco-editor/min/vs' } });

    require(['vs/editor/editor.main'], function () {
      monaco.editor.defineTheme("custom-dark", {
        base: "vs-dark",
        inherit: true,
        rules: [
            { token: "comment", foreground: "6A9955", fontStyle: "italic" },
            { token: "keyword", foreground: "569CD6", fontStyle: "bold" },
            { token: "string", foreground: "CE9178" },
            { token: "number", foreground: "B5CEA8" },
            { token: "delimiter", foreground: "D4D4D4" },
            { token: "type", foreground: "4EC9B0" },
            { token: "function", foreground: "DCDCAA" },
            { token: "variable", foreground: "9CDCFE" },
        ],
        colors: {
            "editor.background": "#00000000",
            "editor.foreground": "#CCCCCC",
            "editorLineNumber.foreground": "#858585",
            "editorLineNumber.activeForeground": "#FFFFFF",
            "editor.selectionBackground": "#264F78",
            "editor.lineHighlightBackground": "#333333",
            "editorStickyScroll.background": "#121921",
            "editorStickyScrollHover.background": "#1E2A35",
            "editorStickyScroll.border": "#333",
        }
      });

      // FIX ANDROID: Funzione migliorata per gestire il font
      function loadFontAndCreateEditor() {
        const font = new FontFace('JetBrainsMono', "url('JetBrainsMonoNL-Regular.ttf')");

        // Timeout di sicurezza per procedere anche se il font non si carica
        const fontTimeout = setTimeout(() => {
          console.warn("Font loading timeout, procedendo con font di fallback");
          createEditor(false); // false = font personalizzato non caricato
        }, 3000);

        font.load().then(() => {
          clearTimeout(fontTimeout);
          document.fonts.add(font);

          // FIX ANDROID: Aspetta un momento per assicurarsi che il font sia applicato
          setTimeout(() => {
            createEditor(true); // true = font personalizzato caricato
          }, 100);
        }).catch((err) => {
          clearTimeout(fontTimeout);
          console.error("Errore caricamento font:", err);
          createEditor(false); // Procedi senza font custom
        });
      }

      function createEditor(customFontLoaded) {
        try {
          const container = document.getElementById('container');

          function isPortrait() {
            return window.innerHeight > window.innerWidth;
          }

          // FIX ANDROID: Configura font family in base al caricamento
          const fontFamily = customFontLoaded ?
            'JetBrainsMono, Consolas, Courier New, monospace' :
            'Consolas, Courier New, monospace';

          window.editor = monaco.editor.create(container, {
            value: "# Inizia a scrivere codice Python qui\nprint('Hello, World!')",
            language: 'python',
            theme: 'custom-dark',
            fontFamily: fontFamily,
            fontSize: 14,
            lineHeight: 22, // FIX ANDROID: Aumentato per maggiore spazio
            letterSpacing: 0, // FIX ANDROID: Kerning zero
            automaticLayout: true,
            minimap: { enabled: false },
            wordWrap: isPortrait() ? "on" : "off",
            lineNumbersMinChars: 3,
            glyphMargin: false,
            renderLineHighlight: "line",
            scrollbar: {
              vertical: 'hidden',
              horizontal: 'hidden',
              overviewRuler: false
            },
            overviewRulerLanes: 0,
            // FIX ANDROID: Opzioni specifiche per mobile
            acceptSuggestionOnEnter: "off",
            quickSuggestions: false,
            wordBasedSuggestions: false,
            suggestOnTriggerCharacters: false,
            parameterHints: { enabled: false },
            hover: { enabled: false },
            contextmenu: false,
            // FIX ANDROID: Migliora gestione input
            disableMonospaceOptimizations: true,
            fontLigatures: false,
            renderWhitespace: "none"
          });

          // FIX ANDROID: Forza ricalcolo delle metriche del font più volte
          function recalculateFontMetrics() {
            monaco.editor.remeasureFonts();

            // Forza un refresh del layout
            setTimeout(() => {
              if (window.editor) {
                window.editor.layout();
                monaco.editor.remeasureFonts();
              }
            }, 50);

            // Secondo refresh per sicurezza
            setTimeout(() => {
              if (window.editor) {
                monaco.editor.remeasureFonts();
              }
            }, 200);
          }

          // Applica il ricalcolo iniziale
          recalculateFontMetrics();

          let isScrolling = false;

          container.addEventListener('touchstart', () => { isScrolling = false; });
          container.addEventListener('touchmove', () => { isScrolling = true; });
          container.addEventListener('touchend', () => {
            if (!isScrolling && typeof Android !== 'undefined') {
              Android.onEditorTouched();
            }
          });

          const debouncedOnTextChangedNotification = debounce(() => {
            if (typeof Android !== 'undefined' && Android !== null) {
              Android.onTextChangedNotification();
            }
          }, 300);

          window.editor.onDidChangeModelContent((e) => {
            debouncedOnTextChangedNotification();

            // FIX ANDROID: Ricalcola font metrics dopo ogni modifica del testo
            setTimeout(() => {
              monaco.editor.remeasureFonts();
            }, 10);
          });

          // Listener per il cambio della posizione del cursore
          window.editor.onDidChangeCursorPosition(function(e) {
            if (typeof Android !== 'undefined' && Android !== null) {
              Android.onCursorPositionChanged(e.position.lineNumber, e.position.column);
            }
          });

          // FIX ANDROID: Setup iniziale del layout con più tentativi
          setTimeout(() => {
            document.documentElement.style.height = window.innerHeight + 'px';
            document.body.style.height = window.innerHeight + 'px';
            document.documentElement.style.width = window.innerWidth + 'px';
            document.body.style.width = window.innerWidth + 'px';
            window.editor.layout();
            recalculateFontMetrics();
          }, 100);

          // FIX ANDROID: Secondo tentativo di layout
          setTimeout(() => {
            if (window.editor) {
              window.editor.layout();
              recalculateFontMetrics();
            }
          }, 500);

          window.getCode = () => window.editor ? window.editor.getValue() : "";
          window.setCode = (code) => {
            if (window.editor) {
              window.editor.getModel().setValue(code);
              // FIX ANDROID: Ricalcola dopo aver impostato nuovo codice
              setTimeout(() => {
                monaco.editor.remeasureFonts();
              }, 50);
            }
          };

          window.addEventListener('resize', debounce(() => {
            document.documentElement.style.height = window.innerHeight + 'px';
            document.body.style.height = window.innerHeight + 'px';
            document.documentElement.style.width = window.innerWidth + 'px';
            document.body.style.width = window.innerWidth + 'px';

            window.editor.updateOptions({
              wordWrap: isPortrait() ? "on" : "off"
            });
            window.editor.layout();

            // FIX ANDROID: Ricalcola font metrics su resize
            recalculateFontMetrics();
          }, 150));

          // FIX ANDROID: Listener per visibilitychange (utile quando app va in background)
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && window.editor) {
              setTimeout(() => {
                window.editor.layout();
                recalculateFontMetrics();
              }, 100);
            }
          });

          if (typeof Android !== 'undefined' && Android !== null) {
            Android.onEditorReady();
          }
        } catch (e) {
          console.error("Errore durante la creazione di Monaco Editor:", e);
        }
      }

      // Avvia la creazione dell'editor
      loadFontAndCreateEditor();
    });
</script>
</body>
</html>
